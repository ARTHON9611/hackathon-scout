name: Hackathon Scout

on:
  schedule:
    # 9 AM + 7 PM IST = 03:30 + 13:30 UTC
    - cron: "30 3,13 * * *"
  workflow_dispatch:

concurrency:
  group: scout
  cancel-in-progress: false

jobs:
  scout:
    runs-on: ubuntu-22.04  # pinned for lifelong stability
    timeout-minutes: 15
    outputs:
      scout_outcome: ${{ steps.run.outcome }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run scout (9AM/7PM IST slot label)
        id: run
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          DORAHACKS_SEED_URLS: ${{ secrets.DORAHACKS_SEED_URLS }}
          SLOT_LABEL: ${{ github.event_name == 'schedule' && 'scheduled IST slot' || 'manual run' }}
        run: python -m src.main

      - name: Upload artifacts (raw + summaries)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scout-data-${{ github.run_number }}
          path: |
            data/raw_*.json
            data/summary.json
            data/whatsapp.txt
            data/email.html
            data/dryrun_rows.json
          if-no-files-found: warn

      # ---------- NOTIFY: email only (WhatsApp removed, Telegram optional later) ----------
      # secrets.* can't be used in `if:` — gate via a shell check into step outputs.
      - name: Check mail configured
        id: mailcfg
        if: always()
        env:
          U: ${{ secrets.MAIL_USERNAME }}
          P: ${{ secrets.MAIL_PASSWORD }}
        run: |
          if [ -n "$U" ] && [ "$U" != "TODO" ] && [ -n "$P" ] && [ "$P" != "TODO" ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"; else echo "enabled=false" >> "$GITHUB_OUTPUT"; fi
      - name: Read summary counts
        id: summary
        if: steps.run.outcome == 'success'
        run: |
          python -c "import json; d=json.load(open('data/summary.json')); print(f\"found={d.get('found_total',0)}\"); print(f\"new={d.get('sheet_new',0)}\"); print(f\"upd={d.get('sheet_updated',0)}\")" >> "$GITHUB_OUTPUT"

      - name: Email success summary
        if: steps.run.outcome == 'success' && steps.mailcfg.outputs.enabled == 'true'
        uses: dawidd6/action-send-mail@v20
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "[Scout] found ${{ steps.summary.outputs.found }} | +${{ steps.summary.outputs.new }} new ~${{ steps.summary.outputs.upd }} updated"
          to: ${{ secrets.MAIL_TO }}
          from: Hackathon Scout
          html_body: file://data/email.html

      # ---------- FAILURE PATH: email ----------
      - name: Email failure alert
        if: steps.run.outcome == 'failure' && steps.mailcfg.outputs.enabled == 'true'
        uses: dawidd6/action-send-mail@v20
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "[Scout FAILED] run ${{ github.run_number }}"
          to: ${{ secrets.MAIL_TO }}
          from: Hackathon Scout
          body: |
            Scout run failed.
            Repo: ${{ github.repository }}
            Logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Artifacts contain raw_*.json + summary.json for forensics.

      - name: Open tracking issue on failure
        if: steps.run.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Scout failed – run ${context.runNumber}`,
              body: `Logs: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\nCheck artifacts (raw_*.json) to see which platform broke. Likely a selector/layout change – see src/scrapers/.`
            });
